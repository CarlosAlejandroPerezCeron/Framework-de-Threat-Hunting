{
  "options": {
    "logger_plugin": "tls",
    "logger_tls_endpoint": "/api/v1/log",
    "logger_tls_server": "http://<IP-SERVIDOR>:9200",
    "logger_tls_compress": true
  },
  "schedule": {
    "processes": {
      "query": "SELECT * FROM processes WHERE name LIKE '%malware%'",
      "interval": 60
    },
    "network": {
      "query": "SELECT * FROM listening_ports WHERE port > 1000",
      "interval": 120
    }
  }
}
